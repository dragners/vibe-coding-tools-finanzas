name: Listado de fondos - tests

on:
  pull_request:
    paths:
      - "apps/listadofondos/**"
      - "services/listadofondos-api/**"
      - ".github/workflows/listadofondos-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/listadofondos/**"
      - "services/listadofondos-api/**"
      - ".github/workflows/listadofondos-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/listadofondos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/listadofondos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/listadofondos-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/listadofondos-api/package-lock.json
      - run: npm ci
      - run: npm test
